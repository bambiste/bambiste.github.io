<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title/description/OG/etc are owned by seo() in src/routes/index.tsx (injected at SSR,
         updated live on the client). This <title> is just a no-JS/no-SSR fallback. -->
    <title>Ibrahima Touré</title>
    <!-- Mark JS-capable before first paint so scroll-reveal only hides content when it can reveal
         it again. With JS off, [data-reveal] stays fully visible (progressive enhancement). -->
    <script>
      document.documentElement.classList.add('js');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
